# The site is committed as prebuilt static files. The build step copies them
# into `dist`, which is the publish directory (matching the project settings).
[build]
  publish = "dist"
  command = "rm -rf dist && mkdir -p dist && cp -R index.html forms.html favicon.svg robots.txt assets dist/"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
